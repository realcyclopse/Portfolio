<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e141f"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Glowing Cyber Core Radial Gradient -->
    <radialGradient id="coreGlow" cx="38%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fcee0a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Yellow Glow Filter -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Badge Base (Chamfered Cyberpunk Rounded Rect) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  
  <!-- Outer Cyber Frame Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#fcee0a" stroke-width="2" stroke-opacity="0.85"/>
  
  <!-- Cyber Corner Tech Accents (Arasaka Red & Cyan) -->
  <path d="M4 14 L14 4" stroke="#ff003c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 4 L60 14" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60 50 L50 60" stroke="#ff003c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 60 L4 50" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Orbiting Torus Ring 1 (Neon Cyan wireframe dashed ellipse) -->
  <ellipse cx="32" cy="32" rx="22" ry="9.5" transform="rotate(-30 32 32)" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="5 3" filter="url(#cyanGlow)"/>

  <!-- Orbiting Torus Ring 2 (Electric Yellow counter-orbit) -->
  <ellipse cx="32" cy="32" rx="21" ry="8.5" transform="rotate(40 32 32)" fill="none" stroke="#fcee0a" stroke-width="1.8" stroke-dasharray="3 3.5" stroke-opacity="0.85"/>

  <!-- The Cyber Core / Cyclops Optical Eye -->
  <circle cx="32" cy="32" r="11" fill="url(#coreGlow)" filter="url(#yellowGlow)"/>

  <!-- Aperture Inner Ring / Netrunner Lens -->
  <circle cx="32" cy="32" r="4.8" fill="#050608" stroke="#00f0ff" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="2" fill="#00f0ff"/>

  <!-- Targeting Reticle Crosshair Ticks -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="#fcee0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#fcee0a" stroke-width="2" stroke-linecap="round"/>
</svg>
